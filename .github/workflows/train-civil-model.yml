name: Train civil drawing AI

on:
  push:
    paths:
      - 'training/**'
      - '.github/workflows/train-civil-model.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install training packages
        run: |
          python -m pip install --upgrade pip
          pip install ultralytics onnx onnxsim pillow

      - name: Generate dataset, train and export ONNX
        run: python training/train_civil_model.py

      - name: Commit trained browser model
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add models/civil_yolo.onnx models/classes.json
          if git diff --cached --quiet; then
            echo "No model changes"
          else
            git commit -m "Train civil drawing AI model"
            git push
          fi

      - name: Upload model artifact
        uses: actions/upload-artifact@v4
        with:
          name: civil-yolo-onnx
          path: |
            models/civil_yolo.onnx
            models/classes.json
