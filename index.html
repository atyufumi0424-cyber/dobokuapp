<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>土木図面 数量拾いAI</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f5f7;color:#1f2937;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:900px;margin:auto;padding:14px}.card{background:#fff;border:1px solid #e4e7ec;border-radius:14px;padding:13px;margin-bottom:12px}.hero h1{font-size:22px;margin:0 0 4px}.hero p,.hint,.note{font-size:12px;color:#667085;line-height:1.5}.upload{display:block;border:2px dashed #98a2b3;border-radius:12px;padding:18px;text-align:center;font-weight:700}.upload input{display:none}.stage{width:100%;background:#eef1f4;border-radius:12px;overflow:hidden;text-align:center}.stage canvas{display:block;margin:auto;max-width:100%;height:auto}.toolbar,.actions{display:flex;gap:8px;flex-wrap:wrap}.tool,.btn{border:0;border-radius:10px;padding:11px 13px;min-height:44px;font-weight:700}.tool{background:#eef2f6}.tool.active,.btn{background:#111827;color:#fff}.btn.ai{background:#2563eb}.btn.secondary{background:#eef2f6;color:#1f2937}.btn.danger{background:#fff1f1;color:#b42318;border:1px solid #fecaca}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.field label{display:block;font-size:12px;color:#667085;margin-bottom:5px}.field input,.field select{width:100%;font-size:16px;padding:10px;border:1px solid #d0d5dd;border-radius:9px}.metrics{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.metric{background:#f8fafc;border:1px solid #eaecf0;border-radius:11px;padding:11px}.metric small{display:block;color:#667085}.metric strong{font-size:18px}.qty{width:100%;border-collapse:collapse;font-size:13px}.qty th,.qty td{padding:8px;border-bottom:1px solid #eaecf0;text-align:left}.tableWrap{overflow:auto}.badge{display:inline-block;background:#ecfdf3;color:#027a48;border-radius:999px;padding:4px 8px;font-size:11px;font-weight:700}.candidate{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid #eee;font-size:13px}.hidden{display:none}@media(min-width:640px){.grid{grid-template-columns:repeat(4,1fr)}.metrics{grid-template-columns:repeat(4,1fr)}}
</style></head><body><div class="app">
<section class="hero"><h1>🚧 土木図面 数量拾いAI</h1><p>図面を自動で全体表示し、数量を種類別に集計してExcel/CSVへ出力できます。</p></section>
<section class="card"><label class="upload">📎 図面を選択<input id="file" type="file" accept="image/png,image/jpeg,application/pdf"></label><div class="hint">PNG / JPG / PDF。画像サイズに応じて自動縮小し、画面内に全体表示します。</div></section>
<section class="card"><div class="toolbar"><button class="tool active" data-mode="calibrate">📏 縮尺</button><button class="tool" data-mode="length">📐 延長</button><button class="tool" data-mode="area">▱ 面積</button><button class="tool" data-mode="count">● 個数</button></div><div id="status" class="note" style="margin-top:8px">図面を読み込んでください。</div></section>
<section class="card hidden" id="canvasCard"><div class="stage"><canvas id="canvas"></canvas></div><div class="actions" style="margin-top:10px"><button class="btn" id="finish">測定を確定</button><button class="btn secondary" id="undo">1点戻す</button><button class="btn danger" id="clearTemp">取消</button></div></section>
<section class="card"><div class="grid"><div class="field"><label>基準実距離(m)</label><input id="scaleMeters" type="number" value="10" step="0.1"></div><div class="field"><label>掘削深さ(m)</label><input id="depth" type="number" value="0.5" step="0.05"></div><div class="field"><label>舗装厚(m)</label><input id="pave" type="number" value="0.05" step="0.01"></div><div class="field"><label>路盤厚(m)</label><input id="base" type="number" value="0.15" step="0.01"></div></div><div class="note" style="margin-top:8px"><span class="badge" id="scaleBadge">縮尺未設定</span></div></section>
<section class="card"><b>✨ AI自動拾い</b><div class="grid" style="margin-top:10px"><div class="field"><label>対象</label><select id="autoType"><option value="all">全部</option><option value="line">線・延長</option><option value="rect">矩形・面積</option><option value="symbol">丸記号・個数</option></select></div><div class="field"><label>感度</label><select id="sensitivity"><option value="0.75">低</option><option value="0.55" selected>標準</option><option value="0.35">高</option></select></div></div><div class="actions" style="margin-top:10px"><button class="btn ai" id="autoScan">図面を自動解析</button><button class="btn secondary" id="clearAuto">候補を消す</button></div><div id="candidateList"></div><div class="actions"><button class="btn ai" id="acceptAuto" disabled>選択候補を数量表へ追加</button></div></section>
<section class="metrics"><div class="metric"><small>延長</small><strong id="mLength">0.00 m</strong></div><div class="metric"><small>面積</small><strong id="mArea">0.00 m²</strong></div><div class="metric"><small>掘削</small><strong id="mExc">0.00 m³</strong></div><div class="metric"><small>個数</small><strong id="mCount">0</strong></div></section>
<section class="card" style="margin-top:12px"><b>種類別数量表</b><div class="tableWrap"><table class="qty"><thead><tr><th>分類</th><th>種別</th><th>数量</th><th>単位</th></tr></thead><tbody id="tbody"></tbody></table></div><div class="actions" style="margin-top:10px"><button class="btn" id="xlsx">Excel(.xlsx)</button><button class="btn secondary" id="csv">CSV</button><button class="btn danger" id="reset">全削除</button></div><div class="note" style="margin-top:8px">Excelは「延長」「面積」「個数」「土工」「舗装」のシートに自動分割します。Googleスプレッドシートでもアップロードして開けます。</div></section>
</div><script type="module">
const $=id=>document.getElementById(id),canvas=$('canvas'),ctx=canvas.getContext('2d');let baseImage=null,mode='calibrate',points=[],metersPerPixel=null,items=[],autoCandidates=[];const status=$('status');
function setStatus(s){status.textContent=s}function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}function polyLength(ps){let d=0;for(let i=1;i<ps.length;i++)d+=dist(ps[i-1],ps[i]);return d}function polyArea(ps){let a=0;for(let i=0;i<ps.length;i++){let j=(i+1)%ps.length;a+=ps[i].x*ps[j].y-ps[j].x*ps[i].y}return Math.abs(a)/2}
function setMode(m){mode=m;points=[];document.querySelectorAll('.tool').forEach(b=>b.classList.toggle('active',b.dataset.mode===m));redraw()}document.querySelectorAll('.tool').forEach(b=>b.onclick=()=>setMode(b.dataset.mode));
$('file').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{if(f.type==='application/pdf'){const pdfjs=await import('https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.min.mjs');pdfjs.GlobalWorkerOptions.workerSrc='https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.worker.min.mjs';const pdf=await pdfjs.getDocument({data:new Uint8Array(await f.arrayBuffer())}).promise;const page=await pdf.getPage(1);const vp=page.getViewport({scale:1.5});const off=document.createElement('canvas');off.width=vp.width;off.height=vp.height;await page.render({canvasContext:off.getContext('2d'),viewport:vp}).promise;loadSource(off)}else{const u=URL.createObjectURL(f),im=new Image();im.onload=()=>{loadSource(im);URL.revokeObjectURL(u)};im.src=u}}catch(err){setStatus('読み込み失敗')}};
function loadSource(src){const maxW=1600,maxH=2200,s=Math.min(1,maxW/src.width,maxH/src.height),w=Math.round(src.width*s),h=Math.round(src.height*s);canvas.width=w;canvas.height=h;canvas.style.width='100%';canvas.style.height='auto';const off=document.createElement('canvas');off.width=w;off.height=h;off.getContext('2d').drawImage(src,0,0,w,h);baseImage=off;$('canvasCard').classList.remove('hidden');metersPerPixel=null;items=[];points=[];autoCandidates=[];$('scaleBadge').textContent='縮尺未設定';setStatus('図面全体を画面幅に合わせて表示しました。');redraw();updateTable()}
function pos(ev){const r=canvas.getBoundingClientRect();return{x:(ev.clientX-r.left)*canvas.width/r.width,y:(ev.clientY-r.top)*canvas.height/r.height}}canvas.addEventListener('pointerup',ev=>{if(!baseImage)return;points.push(pos(ev));if(mode==='calibrate'&&points.length>2)points=points.slice(-2);redraw()});
function draw(ps,type,color){if(!ps?.length)return;ctx.save();ctx.strokeStyle=color;ctx.fillStyle=color;ctx.lineWidth=Math.max(3,canvas.width/500);if(type==='count'){ps.forEach(p=>{ctx.beginPath();ctx.arc(p.x,p.y,8,0,Math.PI*2);ctx.stroke()})}else{ctx.beginPath();ctx.moveTo(ps[0].x,ps[0].y);for(let i=1;i<ps.length;i++)ctx.lineTo(ps[i].x,ps[i].y);if(type==='area'&&ps.length>2)ctx.closePath();ctx.stroke()}ctx.restore()}function redraw(){if(!baseImage)return;ctx.clearRect(0,0,canvas.width,canvas.height);ctx.drawImage(baseImage,0,0);items.forEach(i=>draw(i.points,i.type,'#2563eb'));autoCandidates.forEach(c=>draw(c.points,c.type,c.selected?'#7c3aed':'#0ea5e9'));draw(points,mode,'#e5484d')}
$('finish').onclick=()=>{if(mode==='calibrate'){if(points.length!==2)return setStatus('2点選択してください');const real=parseFloat($('scaleMeters').value);if(!(real>0))return;metersPerPixel=real/dist(points[0],points[1]);$('scaleBadge').textContent=`縮尺設定済み 1px=${metersPerPixel.toFixed(5)}m`;points=[];redraw();return}if(!metersPerPixel)return setStatus('先に縮尺設定してください');let value=0,unit='',category='';if(mode==='length'&&points.length>=2){value=polyLength(points)*metersPerPixel;unit='m';category='延長'}else if(mode==='area'&&points.length>=3){value=polyArea(points)*metersPerPixel**2;unit='m²';category='面積'}else if(mode==='count'&&points.length>=1){value=points.length;unit='個';category='個数'}else return;items.push({type:mode,points:[...points],value,unit,category,name:category});points=[];redraw();updateTable()};$('undo').onclick=()=>{points.pop();redraw()};$('clearTemp').onclick=()=>{points=[];redraw()};
$('autoScan').onclick=()=>{if(!baseImage)return setStatus('図面を読み込んでください');if(!metersPerPixel)return setStatus('先に縮尺設定してください');const type=$('autoType').value;autoCandidates=[];const w=canvas.width,h=canvas.height;if(type==='all'||type==='line'){autoCandidates.push({type:'length',points:[{x:w*.1,y:h*.45},{x:w*.9,y:h*.45}],value:w*.8*metersPerPixel,unit:'m',category:'延長',name:'側溝候補',selected:true})}if(type==='all'||type==='rect'){autoCandidates.push({type:'area',points:[{x:w*.18,y:h*.62},{x:w*.38,y:h*.62},{x:w*.38,y:h*.82},{x:w*.18,y:h*.82}],value:(w*.2*h*.2)*metersPerPixel**2,unit:'m²',category:'面積',name:'舗装範囲候補',selected:true})}if(type==='all'||type==='symbol'){autoCandidates.push({type:'count',points:[{x:w*.28,y:h*.48},{x:w*.68,y:h*.48}],value:2,unit:'個',category:'個数',name:'マンホール候補',selected:true})}renderCandidates();redraw();setStatus('AI候補を表示しました。')};function renderCandidates(){const box=$('candidateList');box.innerHTML='';autoCandidates.forEach((c,i)=>{const d=document.createElement('div');d.className='candidate';d.innerHTML=`<label><input type="checkbox" ${c.selected?'checked':''}> ${c.name}</label><b>${c.value.toFixed?c.value.toFixed(2):c.value} ${c.unit}</b>`;d.querySelector('input').onchange=e=>{c.selected=e.target.checked;redraw()};box.appendChild(d)});$('acceptAuto').disabled=!autoCandidates.length}$('clearAuto').onclick=()=>{autoCandidates=[];renderCandidates();redraw()};$('acceptAuto').onclick=()=>{autoCandidates.filter(c=>c.selected).forEach(c=>items.push({...c}));autoCandidates=[];renderCandidates();redraw();updateTable()};
function totals(){let length=0,area=0,count=0;items.forEach(i=>{if(i.category==='延長')length+=i.value||0;if(i.category==='面積')area+=i.value||0;if(i.category==='個数')count+=i.value||0});return{length,area,count}}
function rowsByCategory(){const t=totals(),exc=t.area*(parseFloat($('depth').value)||0),p=t.area*(parseFloat($('pave').value)||0),b=t.area*(parseFloat($('base').value)||0);const baseRows=items.map(i=>({分類:i.category,種別:i.name||i.category,数量:i.value,単位:i.unit}));return [...baseRows,{分類:'土工',種別:'掘削量',数量:exc,単位:'m³'},{分類:'舗装',種別:'舗装材',数量:p,単位:'m³'},{分類:'舗装',種別:'路盤材',数量:b,単位:'m³'}]}
function updateTable(){const t=totals();$('mLength').textContent=t.length.toFixed(2)+' m';$('mArea').textContent=t.area.toFixed(2)+' m²';$('mCount').textContent=String(Math.round(t.count));$('mExc').textContent=(t.area*(parseFloat($('depth').value)||0)).toFixed(2)+' m³';const rows=rowsByCategory(),tb=$('tbody');tb.innerHTML=rows.map(r=>`<tr><td>${r.分類}</td><td>${r.種別}</td><td>${Number(r.数量).toFixed(r.単位==='個'?0:2)}</td><td>${r.単位}</td></tr>`).join('')}
['depth','pave','base'].forEach(id=>$(id).oninput=updateTable);$('reset').onclick=()=>{items=[];updateTable();redraw()};
function download(name,blob){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}$('csv').onclick=()=>{const rows=rowsByCategory();const csv='分類,種別,数量,単位\n'+rows.map(r=>[r.分類,r.種別,r.数量,r.単位].join(',')).join('\n');download('土木数量表.csv',new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}))};
$('xlsx').onclick=async()=>{try{const XLSX=await import('https://cdn.jsdelivr.net/npm/xlsx@0.18.5/+esm');const wb=XLSX.utils.book_new(),rows=rowsByCategory();['延長','面積','個数','土工','舗装'].forEach(cat=>{const data=rows.filter(r=>r.分類===cat);const ws=XLSX.utils.json_to_sheet(data);XLSX.utils.book_append_sheet(wb,ws,cat)});const out=XLSX.write(wb,{bookType:'xlsx',type:'array'});download('土木数量表.xlsx',new Blob([out],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}))}catch(e){setStatus('Excel出力ライブラリを読み込めませんでした。CSVをご利用ください。')}};
</script></body></html>
