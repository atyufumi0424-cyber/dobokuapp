<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>土木図面 数量拾いAI</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f5f7;color:#202124;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:480px;margin:auto;background:#fff;min-height:100vh;padding:16px}h1{font-size:23px;margin:4px 0 6px}.sub{font-size:13px;color:#666;line-height:1.5}.upload{margin:18px 0;padding:22px 12px;border:2px dashed #b8bdc7;border-radius:14px;text-align:center;font-weight:700}.tabs{display:flex;gap:6px;overflow:auto;margin:12px 0}.tab{white-space:nowrap;background:#eef0f3;padding:9px 12px;border-radius:20px;font-size:13px}.tab.on{background:#222;color:#fff}.plan{height:250px;background:#fafafa;border:1px solid #ddd;border-radius:14px;position:relative;overflow:hidden}.road{position:absolute;left:30px;right:30px;top:118px;border-top:8px solid #333}.box{position:absolute;left:90px;right:90px;top:60px;height:130px;border:4px solid #444}.det{position:absolute;left:25px;right:25px;top:114px;border-top:3px solid #e14b36}.metrics{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.m{background:#f5f6f8;border:1px solid #e5e7eb;border-radius:12px;padding:12px}.m small{display:block;color:#70757a}.m b{font-size:20px}.card{margin-top:12px;border:1px solid #e5e7eb;border-radius:14px;padding:14px}.row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #eee}.btn{margin-top:14px;background:#222;color:white;border-radius:12px;padding:14px;text-align:center;font-weight:700}</style></head><body><div class="app"><h1>🚧 土木図面 数量拾いAI</h1><div class="sub">平面図から延長・面積を拾い、土工・舗装数量まで計算</div><div class="upload">📎 図面を挿入<br><span style="font-size:12px;color:#777">PDF / PNG / JPG</span></div><div class="tabs"><div class="tab on">👀 図面</div><div class="tab">✨ 自動拾い</div><div class="tab">🧮 土木数量</div><div class="tab">📋 数量表</div></div><div class="plan"><div class="road"></div><div class="box"></div><div class="det"></div></div><div class="metrics"><div class="m"><small>延長</small><b>48.6 m</b></div><div class="m"><small>施工面積</small><b>126.4 m²</b></div><div class="m"><small>掘削</small><b>63.2 m³</b></div><div class="m"><small>盛土</small><b>25.3 m³</b></div></div><div class="card"><b>数量表</b><div class="row"><span>舗装材</span><strong>6.32 m³</strong></div><div class="row"><span>路盤材</span><strong>18.96 m³</strong></div><div class="row"><span>コンクリート</span><strong>12.64 m³</strong></div></div><div class="btn">⬇️ 数量表CSVを出力</div></div></body></html>
