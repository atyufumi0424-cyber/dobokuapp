<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>土木図面 学習AI</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f4f6f8;color:#172033;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:760px;margin:auto;padding:14px}.card{background:#fff;border:1px solid #e4e7ec;border-radius:14px;padding:13px;margin-bottom:12px}h1{font-size:22px;margin:4px 0 6px}.sub,.note{font-size:12px;color:#667085;line-height:1.55}.upload{display:block;border:2px dashed #98a2b3;border-radius:12px;padding:18px;text-align:center;font-weight:700}.upload input{display:none}.btn{border:0;border-radius:10px;padding:12px 14px;min-height:44px;font-weight:700;background:#1d4ed8;color:#fff}.btn:disabled{opacity:.45}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.badge{display:inline-block;border-radius:999px;padding:5px 9px;font-size:11px;font-weight:700;background:#fff3cd;color:#855d00}.badge.ok{background:#dcfce7;color:#166534}.badge.err{background:#fee2e2;color:#991b1b}.stage{width:100%;overflow:hidden;background:#eef1f4;border-radius:12px}.stage canvas{display:block;width:100%;height:auto}.results{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.metric{border:1px solid #e5e7eb;background:#f8fafc;border-radius:11px;padding:10px}.metric small{display:block;color:#667085}.metric strong{font-size:19px}.tbl{width:100%;border-collapse:collapse;font-size:13px}.tbl th,.tbl td{padding:9px 6px;border-bottom:1px solid #eee;text-align:left}@media(min-width:640px){.results{grid-template-columns:repeat(4,1fr)}}
</style></head><body><div class="app"><h1>🧠 土木図面 学習AI</h1><div class="sub">学習済みONNXモデルで、マンホール・集水桝・側溝・縁石を自動認識します。</div>
<section class="card"><div class="row"><span id="modelBadge" class="badge">モデル確認中…</span><span class="note" id="modelMsg"></span></div></section>
<section class="card"><label class="upload">📎 図面画像を選択<input id="file" type="file" accept="image/png,image/jpeg"></label><div class="row" style="margin-top:10px"><button class="btn" id="run" disabled>学習AIで解析</button></div><div class="note" style="margin-top:8px">現在の学習モデルはPNG/JPG向けです。PDFは既存ページで画像化してから利用できます。</div></section>
<section class="card"><div class="stage"><canvas id="cv" width="1024" height="768"></canvas></div></section>
<section class="results"><div class="metric"><small>マンホール</small><strong id="c0">0</strong></div><div class="metric"><small>集水桝</small><strong id="c1">0</strong></div><div class="metric"><small>側溝候補</small><strong id="c2">0</strong></div><div class="metric"><small>縁石候補</small><strong id="c3">0</strong></div></section>
<section class="card" style="margin-top:12px"><strong>検出結果</strong><table class="tbl"><thead><tr><th>種類</th><th>信頼度</th></tr></thead><tbody id="tbody"><tr><td colspan="2">まだ解析していません</td></tr></tbody></table></section>
<section class="card"><div class="note">※これは合成図面で作った初期学習モデルです。実際の施工図面を追加学習すると精度が大きく改善します。側溝・縁石は長い物体として検出し、既存の縮尺機能と組み合わせて延長数量へ変換する想定です。</div></section></div>
<script type="module">
const badge=document.getElementById('modelBadge'),msg=document.getElementById('modelMsg'),file=document.getElementById('file'),run=document.getElementById('run'),cv=document.getElementById('cv'),ctx=cv.getContext('2d'),tbody=document.getElementById('tbody');
const NAMES=['マンホール','集水桝','側溝','縁石'];let source=null,ort=null,session=null;
function setBadge(t,k=''){badge.textContent=t;badge.className='badge '+k}
async function boot(){try{const head=await fetch('./models/civil_yolo.onnx',{method:'HEAD',cache:'no-store'});if(!head.ok)throw new Error('モデル未生成');setBadge('モデルあり','ok');msg.textContent='ブラウザAIを読み込み中';ort=await import('https://cdn.jsdelivr.net/npm/onnxruntime-web@1.20.1/+esm');session=await ort.InferenceSession.create('./models/civil_yolo.onnx',{executionProviders:['wasm']});setBadge('学習AI 使用可能','ok');msg.textContent='';if(source)run.disabled=false}catch(e){setBadge('モデル学習中 / 未配置','err');msg.textContent='GitHub Actionsの学習完了後に自動で使用可能になります。';console.error(e)}}boot();
file.addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const u=URL.createObjectURL(f),im=new Image();im.onload=()=>{source=im;const scale=Math.min(1,1400/im.width,1800/im.height);cv.width=Math.round(im.width*scale);cv.height=Math.round(im.height*scale);ctx.drawImage(im,0,0,cv.width,cv.height);URL.revokeObjectURL(u);run.disabled=!session};im.src=u});
function iou(a,b){const x1=Math.max(a.x1,b.x1),y1=Math.max(a.y1,b.y1),x2=Math.min(a.x2,b.x2),y2=Math.min(a.y2,b.y2),inter=Math.max(0,x2-x1)*Math.max(0,y2-y1),aa=(a.x2-a.x1)*(a.y2-a.y1),bb=(b.x2-b.x1)*(b.y2-b.y1);return inter/(aa+bb-inter+1e-6)}
function nms(boxes,thr=.45){boxes.sort((a,b)=>b.score-a.score);const out=[];while(boxes.length){const a=boxes.shift();out.push(a);boxes=boxes.filter(b=>a.cls!==b.cls||iou(a,b)<thr)}return out}
function prep(){const s=512,off=document.createElement('canvas');off.width=s;off.height=s;const o=off.getContext('2d');o.fillStyle='white';o.fillRect(0,0,s,s);const scale=Math.min(s/cv.width,s/cv.height),dw=cv.width*scale,dh=cv.height*scale,px=(s-dw)/2,py=(s-dh)/2;o.drawImage(cv,px,py,dw,dh);const data=o.getImageData(0,0,s,s).data,arr=new Float32Array(3*s*s);for(let i=0;i<s*s;i++){arr[i]=data[i*4]/255;arr[s*s+i]=data[i*4+1]/255;arr[2*s*s+i]=data[i*4+2]/255}return{tensor:new ort.Tensor('float32',arr,[1,3,s,s]),scale,px,py}}
function parse(out,meta){const dims=out.dims,data=out.data;let rows,cols,get;if(dims.length!==3)throw new Error('想定外のモデル出力');if(dims[1]<dims[2]){cols=dims[1];rows=dims[2];get=(r,c)=>data[c*rows+r]}else{rows=dims[1];cols=dims[2];get=(r,c)=>data[r*cols+c]}const boxes=[];for(let r=0;r<rows;r++){let best=0,cls=0;for(let c=4;c<Math.min(cols,8);c++){const v=get(r,c);if(v>best){best=v;cls=c-4}}if(best<.35)continue;const cx=get(r,0),cy=get(r,1),w=get(r,2),h=get(r,3);let x1=(cx-w/2-meta.px)/meta.scale,y1=(cy-h/2-meta.py)/meta.scale,x2=(cx+w/2-meta.px)/meta.scale,y2=(cy+h/2-meta.py)/meta.scale;x1=Math.max(0,Math.min(cv.width,x1));x2=Math.max(0,Math.min(cv.width,x2));y1=Math.max(0,Math.min(cv.height,y1));y2=Math.max(0,Math.min(cv.height,y2));if(x2-x1>2&&y2-y1>2)boxes.push({x1,y1,x2,y2,score:best,cls})}return nms(boxes)}
run.addEventListener('click',async()=>{if(!session||!source)return;run.disabled=true;run.textContent='解析中…';ctx.drawImage(source,0,0,cv.width,cv.height);try{const meta=prep(),name=session.inputNames[0],res=await session.run({[name]:meta.tensor}),out=res[session.outputNames[0]],boxes=parse(out,meta),counts=[0,0,0,0];ctx.lineWidth=Math.max(2,cv.width/450);ctx.font=`${Math.max(13,cv.width/65)}px sans-serif`;tbody.innerHTML='';for(const b of boxes){counts[b.cls]++;ctx.strokeStyle=['#e11d48','#7c3aed','#0284c7','#16a34a'][b.cls];ctx.fillStyle=ctx.strokeStyle;ctx.strokeRect(b.x1,b.y1,b.x2-b.x1,b.y2-b.y1);ctx.fillText(`${NAMES[b.cls]} ${(b.score*100).toFixed(0)}%`,b.x1+3,Math.max(15,b.y1-4));const tr=document.createElement('tr');tr.innerHTML=`<td>${NAMES[b.cls]}</td><td>${(b.score*100).toFixed(1)}%</td>`;tbody.appendChild(tr)}if(!boxes.length)tbody.innerHTML='<tr><td colspan="2">検出なし</td></tr>';counts.forEach((v,i)=>document.getElementById('c'+i).textContent=v)}catch(e){alert('解析に失敗しました: '+e.message);console.error(e)}finally{run.disabled=false;run.textContent='学習AIで解析'}});
</script></body></html>
