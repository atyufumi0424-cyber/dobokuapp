<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>土木図面 学習AI</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f4f6f8;color:#172033;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:820px;margin:auto;padding:14px}.card{background:#fff;border:1px solid #e4e7ec;border-radius:14px;padding:13px;margin-bottom:12px}h1{font-size:22px;margin:4px 0 6px}.sub,.note{font-size:12px;color:#667085;line-height:1.55}.upload{display:block;border:2px dashed #98a2b3;border-radius:12px;padding:18px;text-align:center;font-weight:700}.upload input{display:none}.btn{border:0;border-radius:10px;padding:12px 14px;min-height:44px;font-weight:700;background:#1d4ed8;color:#fff}.btn.secondary{background:#475467}.btn.green{background:#15803d}.btn:disabled{opacity:.45}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.badge{display:inline-block;border-radius:999px;padding:5px 9px;font-size:11px;font-weight:700;background:#fff3cd;color:#855d00}.badge.ok{background:#dcfce7;color:#166534}.badge.err{background:#fee2e2;color:#991b1b}.stage{width:100%;overflow:hidden;background:#eef1f4;border-radius:12px;min-height:220px}.stage canvas{display:block;width:100%;height:auto}.results{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.metric{border:1px solid #e5e7eb;background:#f8fafc;border-radius:11px;padding:10px}.metric small{display:block;color:#667085}.metric strong{font-size:19px}.tblwrap{overflow:auto}.tbl{width:100%;border-collapse:collapse;font-size:13px;min-width:520px}.tbl th,.tbl td{padding:9px 6px;border-bottom:1px solid #eee;text-align:left}.status{margin-top:10px;padding:10px;border-radius:10px;background:#f8fafc;border:1px solid #e5e7eb;font-size:13px;font-weight:700;line-height:1.45}.status.run{background:#eff6ff;color:#1d4ed8}.status.ok{background:#ecfdf3;color:#166534}.status.warn{background:#fff7ed;color:#9a3412}.status.err{background:#fef2f2;color:#991b1b}.sectionTitle{font-weight:800;margin-bottom:8px}.ocrText{white-space:pre-wrap;max-height:180px;overflow:auto;background:#f8fafc;border-radius:9px;padding:9px;font-size:12px;color:#475467}select{min-height:44px;border:1px solid #d0d5dd;border-radius:10px;padding:0 10px;background:white}@media(min-width:640px){.results{grid-template-columns:repeat(5,1fr)}}</style>
<script defer src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.20.1/dist/ort.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script></head><body><div class="app">
<h1>🧠 土木図面 学習AI</h1><div class="sub">構造物AI検出＋寸法OCR＋Excel出力</div>
<section class="card"><div class="row"><span id="modelBadge" class="badge">AI準備中…</span><span id="modelMsg" class="note">OCRはAIが読めなくても使用できます</span></div></section>
<section class="card"><label class="upload">📎 図面画像を選択<input id="file" type="file" accept="image/*"></label><div class="row" style="margin-top:10px"><button id="run" class="btn" disabled>AI＋寸法を解析</button><button id="ocrOnly" class="btn secondary" disabled>寸法だけ再読取</button><select id="thr"><option value="0.05">検出感度：超高</option><option value="0.10">検出感度：高</option><option value="0.20" selected>検出感度：標準</option><option value="0.35">検出感度：低</option></select></div><div id="status" class="status">図面を選択してください</div></section>
<section class="card"><div class="stage"><canvas id="cv" width="1024" height="768"></canvas></div></section>
<section class="results"><div class="metric"><small>マンホール</small><strong id="c0">0</strong></div><div class="metric"><small>集水桝</small><strong id="c1">0</strong></div><div class="metric"><small>側溝候補</small><strong id="c2">0</strong></div><div class="metric"><small>縁石候補</small><strong id="c3">0</strong></div><div class="metric"><small>最高信頼度</small><strong id="maxScore">-</strong></div></section>
<section class="card" style="margin-top:12px"><div class="sectionTitle">AI検出結果</div><div class="tblwrap"><table class="tbl"><thead><tr><th>種類</th><th>信頼度</th></tr></thead><tbody id="tbody"><tr><td colspan="2">まだ解析していません</td></tr></tbody></table></div></section>
<section class="card"><div class="sectionTitle">📏 寸法・数値OCR</div><div class="tblwrap"><table class="tbl"><thead><tr><th>種類</th><th>値</th><th>単位</th><th>元文字</th></tr></thead><tbody id="dimBody"><tr><td colspan="4">まだ読み取っていません</td></tr></tbody></table></div></section>
<section class="card"><div class="sectionTitle">OCR全文</div><div id="ocrText" class="ocrText">まだ読み取っていません</div></section>
<section class="card"><button id="excel" class="btn green" disabled>Excel(.xlsx)出力</button></section></div>
<script>
const $=id=>document.getElementById(id),file=$('file'),run=$('run'),ocrOnly=$('ocrOnly'),excel=$('excel'),cv=$('cv'),ctx=cv.getContext('2d'),status=$('status'),badge=$('modelBadge'),msg=$('modelMsg'),tbody=$('tbody'),dimBody=$('dimBody'),ocrText=$('ocrText'),thr=$('thr');
const NAMES=['マンホール','集水桝','側溝','縁石'];let source=null,session=null,inputSize=512,lastBoxes=[],dimensions=[],ocrRaw='';
function setStatus(t,k=''){status.textContent=t;status.className='status '+k}function setBadge(t,k=''){badge.textContent=t;badge.className='badge '+k}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));async function waitLib(name,ms=12000){const s=Date.now();while(!window[name]&&Date.now()-s<ms)await sleep(200);return window[name]}
async function boot(){const o=await waitLib('ort',12000);if(!o){setBadge('AIライブラリ読込失敗','err');msg.textContent='OCRは使用できます';return}try{setBadge('AIモデル読込中…');o.env.wasm.wasmPaths='https://cdn.jsdelivr.net/npm/onnxruntime-web@1.20.1/dist/';session=await Promise.race([o.InferenceSession.create('./models/civil_yolo.onnx',{executionProviders:['wasm']}),new Promise((_,j)=>setTimeout(()=>j(new Error('30秒タイムアウト')),30000))]);const md=session.inputMetadata?.[session.inputNames[0]],d=md?.dimensions||md?.dims;if(Array.isArray(d)&&Number(d[2]))inputSize=Number(d[2]);setBadge('学習AI 使用可能','ok');msg.textContent='入力 '+inputSize+'px';if(source)run.disabled=false}catch(e){setBadge('AIモデル読込失敗','err');msg.textContent=(e.message||e)+' / OCRは使用できます'}}window.addEventListener('load',boot);
file.addEventListener('change',()=>{const f=file.files&&file.files[0];if(!f)return;setStatus('画像ファイルを読み込み中…','run');const r=new FileReader();r.onerror=()=>setStatus('画像ファイルを読み込めませんでした','err');r.onload=()=>{const im=new Image();im.onload=()=>{source=im;const s=Math.min(1,1600/im.naturalWidth,2200/im.naturalHeight);cv.width=Math.max(1,Math.round(im.naturalWidth*s));cv.height=Math.max(1,Math.round(im.naturalHeight*s));ctx.clearRect(0,0,cv.width,cv.height);ctx.drawImage(im,0,0,cv.width,cv.height);run.disabled=!session;ocrOnly.disabled=false;excel.disabled=true;lastBoxes=[];dimensions=[];ocrRaw='';$('maxScore').textContent='-';ocrText.textContent='まだ読み取っていません';dimBody.innerHTML='<tr><td colspan="4">まだ読み取っていません</td></tr>';setStatus('画像を読み込みました（'+im.naturalWidth+'×'+im.naturalHeight+'）。'+(session?'AI＋OCRを実行できます':'OCRを実行できます'),'ok')};im.onerror=()=>setStatus('選択画像をデコードできませんでした。JPEG/PNGで試してください。','err');im.src=r.result};r.readAsDataURL(f)});
function prep(){const s=inputSize,off=document.createElement('canvas');off.width=s;off.height=s;const o=off.getContext('2d');o.fillStyle='#fff';o.fillRect(0,0,s,s);const sc=Math.min(s/cv.width,s/cv.height),dw=cv.width*sc,dh=cv.height*sc,px=(s-dw)/2,py=(s-dh)/2;o.drawImage(source,px,py,dw,dh);const d=o.getImageData(0,0,s,s).data,a=new Float32Array(3*s*s);for(let i=0;i<s*s;i++){a[i]=d[i*4]/255;a[s*s+i]=d[i*4+1]/255;a[2*s*s+i]=d[i*4+2]/255}return{tensor:new ort.Tensor('float32',a,[1,3,s,s]),sc,px,py}}
function iou(a,b){const x1=Math.max(a.x1,b.x1),y1=Math.max(a.y1,b.y1),x2=Math.min(a.x2,b.x2),y2=Math.min(a.y2,b.y2),it=Math.max(0,x2-x1)*Math.max(0,y2-y1),aa=(a.x2-a.x1)*(a.y2-a.y1),bb=(b.x2-b.x1)*(b.y2-b.y1);return it/(aa+bb-it+1e-6)}function nms(b){b.sort((a,c)=>c.score-a.score);const o=[];while(b.length){const a=b.shift();o.push(a);b=b.filter(x=>a.cls!==x.cls||iou(a,x)<.45)}return o}
function parse(out,m,min){const dims=out.dims,data=out.data;let rows,cols,get;if(dims[1]<dims[2]){cols=dims[1];rows=dims[2];get=(r,c)=>data[c*rows+r]}else{rows=dims[1];cols=dims[2];get=(r,c)=>data[r*cols+c]}const b=[];let mx=0;for(let r=0;r<rows;r++){let best=-1,cls=0;for(let c=4;c<Math.min(cols,8);c++){const v=get(r,c);if(v>best){best=v;cls=c-4}}mx=Math.max(mx,best);if(best<min)continue;const cx=get(r,0),cy=get(r,1),w=get(r,2),h=get(r,3);let x1=(cx-w/2-m.px)/m.sc,y1=(cy-h/2-m.py)/m.sc,x2=(cx+w/2-m.px)/m.sc,y2=(cy+h/2-m.py)/m.sc;x1=Math.max(0,Math.min(cv.width,x1));x2=Math.max(0,Math.min(cv.width,x2));y1=Math.max(0,Math.min(cv.height,y1));y2=Math.max(0,Math.min(cv.height,y2));if(x2>x1&&y2>y1)b.push({x1,y1,x2,y2,score:best,cls})}return{boxes:nms(b),mx}}
async function runAI(){if(!session)return 0;const m=prep(),res=await session.run({[session.inputNames[0]]:m.tensor}),p=parse(res[session.outputNames[0]],m,Number(thr.value));lastBoxes=p.boxes;$('maxScore').textContent=(p.mx*100).toFixed(1)+'%';ctx.drawImage(source,0,0,cv.width,cv.height);const counts=[0,0,0,0];tbody.innerHTML='';for(const b of p.boxes){counts[b.cls]++;ctx.strokeStyle=['#e11d48','#7c3aed','#0284c7','#16a34a'][b.cls];ctx.lineWidth=2;ctx.strokeRect(b.x1,b.y1,b.x2-b.x1,b.y2-b.y1);tbody.insertAdjacentHTML('beforeend',`<tr><td>${NAMES[b.cls]}</td><td>${(b.score*100).toFixed(1)}%</td></tr>`)}counts.forEach((v,i)=>$('c'+i).textContent=v);if(!p.boxes.length)tbody.innerHTML='<tr><td colspan="2">検出なし</td></tr>';return p.boxes.length}
function addDim(type,v,u,raw){v=Number(v);if(!Number.isFinite(v)||v<=0)return;const k=type+'|'+v+'|'+u+'|'+raw;if(!dimensions.some(x=>x.k===k))dimensions.push({k,type,value:v,unit:u,raw})}function extract(t){dimensions=[];for(const line of t.replace(/×/g,'x').replace(/[：]/g,':').split(/\n+/)){let m;const regs=[['幅',/\bW\s*[=:]?\s*(\d+(?:\.\d+)?)\s*m\b/ig],['長さ',/\bL\s*[=:]?\s*(\d+(?:\.\d+)?)\s*m\b/ig],['高さ',/\bH\s*[=:]?\s*(\d+(?:\.\d+)?)\s*m\b/ig],['寸法',/(\d+(?:\.\d+)?)\s*m\b/ig]];for(const [type,re] of regs)while((m=re.exec(line)))addDim(type,m[1],'m',line);const ar=/(\d+(?:\.\d+)?)\s*m?\s*[xX]\s*(\d+(?:\.\d+)?)\s*m/ig;while((m=ar.exec(line))){addDim('長さ',m[1],'m',line);addDim('幅',m[2],'m',line);addDim('面積',Number(m[1])*Number(m[2]),'m²',line)}const sc=/\bS\s*[=:]\s*1\s*[:/]\s*(\d{2,6})/ig;while((m=sc.exec(line)))addDim('縮尺',m[1],'1:n',line)}}
async function runOCR(){const T=await waitLib('Tesseract',15000);if(!T)throw new Error('OCRライブラリを読み込めません');setStatus('寸法文字を読み取り中…','run');const res=await T.recognize(source,'eng',{logger:m=>{if(m.status==='recognizing text')setStatus('寸法OCR '+Math.round((m.progress||0)*100)+'%','run')}});ocrRaw=res.data.text||'';ocrText.textContent=ocrRaw||'文字を読み取れませんでした';extract(ocrRaw);dimBody.innerHTML=dimensions.length?'':'<tr><td colspan="4">寸法を検出できませんでした</td></tr>';for(const d of dimensions)dimBody.insertAdjacentHTML('beforeend',`<tr><td>${d.type}</td><td>${d.value}</td><td>${d.unit}</td><td>${d.raw}</td></tr>`);return dimensions.length}
async function full(){if(!source)return;run.disabled=true;ocrOnly.disabled=true;try{setStatus('AI解析中…','run');const a=await runAI();const d=await runOCR();excel.disabled=!(a||d);setStatus(`完了：AI ${a}件・寸法 ${d}件`,'ok')}catch(e){setStatus('解析エラー：'+(e.message||e),'err')}finally{run.disabled=!session;ocrOnly.disabled=false}}run.addEventListener('click',full);ocrOnly.addEventListener('click',async()=>{if(!source)return;ocrOnly.disabled=true;try{const d=await runOCR();excel.disabled=!(lastBoxes.length||d);setStatus('寸法OCR完了：'+d+'件','ok')}catch(e){setStatus('OCRエラー：'+(e.message||e),'err')}finally{ocrOnly.disabled=false}});
excel.addEventListener('click',()=>{if(!window.XLSX)return setStatus('Excelライブラリ未読込','err');const wb=XLSX.utils.book_new(),ai=lastBoxes.map((b,i)=>({No:i+1,種類:NAMES[b.cls],信頼度:Number((b.score*100).toFixed(1))})),dm=dimensions.map((d,i)=>({No:i+1,種類:d.type,値:d.value,単位:d.unit,元文字:d.raw}));XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(ai.length?ai:[{結果:'検出なし'}]),'AI検出');XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(dm.length?dm:[{結果:'寸法なし'}]),'寸法OCR');XLSX.writeFile(wb,'土木図面_AI数量・寸法.xlsx')});
</script></body></html>
